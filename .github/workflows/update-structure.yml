name: Update Repo Structure

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate folder-wise structure in README
        run: |
          python3 - <<'EOF'
          import os, re
          from urllib.parse import quote

          SKIP_DIRS = {'.git', '.github', 'node_modules', 'out', 'bin'}
          SKIP_EXT = ('.class',)
          ICONS = {'.java': '☕', '.md': '📝', '.png': '🖼️', '.jpg': '🖼️', '.jpeg': '🖼️', '.yml': '⚙️', '.yaml': '⚙️'}

          def icon(name):
              return ICONS.get(os.path.splitext(name)[1].lower(), '📄')

          def list_files(folder):
              out = []
              for root, dirs, files in os.walk(folder):
                  dirs[:] = sorted(d for d in dirs if d not in SKIP_DIRS and not d.startswith('.'))
                  for f in sorted(files):
                      if f.endswith(SKIP_EXT) or f.startswith('.'):
                          continue
                      out.append(os.path.relpath(os.path.join(root, f), '.').replace(os.sep, '/'))
              return out

          dirs = sorted(d for d in os.listdir('.') if os.path.isdir(d) and d not in SKIP_DIRS and not d.startswith('.'))
          root_files = sorted(f for f in os.listdir('.') if os.path.isfile(f) and not f.startswith('.') and not f.endswith(SKIP_EXT))

          lines = []
          total = 0
          for d in dirs:
              files = list_files(d)
              total += len(files)
              lines.append('<details>')
              lines.append(f'<summary>📁 <b>{d}</b> — {len(files)} files</summary>')
              lines.append('')
              for p in files:
                  label = p[len(d) + 1:]
                  lines.append(f'- {icon(p)} [{label}]({quote(p)})')
              lines.append('')
              lines.append('</details>')
              lines.append('')

          if root_files:
              lines.append('<details>')
              lines.append(f'<summary>📁 <b>Root files</b> — {len(root_files)} files</summary>')
              lines.append('')
              for f in root_files:
                  lines.append(f'- {icon(f)} [{f}]({quote(f)})')
              lines.append('')
              lines.append('</details>')
              lines.append('')
              total += len(root_files)

          summary = f'**{len(dirs)} folders · {total} files** — tap a folder to expand 👇'
          body = summary + '\n\n' + '\n'.join(lines).rstrip() + '\n'

          start, end = '<!-- STRUCTURE:START -->', '<!-- STRUCTURE:END -->'
          block = start + '\n' + body + end
          readme = open('README.md', encoding='utf-8').read()
          if start in readme:
              readme = re.sub(re.escape(start) + r'.*?' + re.escape(end), lambda m: block, readme, flags=re.S)
          else:
              readme += '\n\n## 🗂️ Repository Structure\n\n' + block + '\n'
          open('README.md', 'w', encoding='utf-8').write(readme)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "docs: update repo structure [skip ci]" && git push)
