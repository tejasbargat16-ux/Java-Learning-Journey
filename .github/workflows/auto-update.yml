name: Auto Notes & Structure

on:
	push:
		branches: [main]
		paths:
			- 'Day-*/**'
			- 'scripts/**'
	workflow_dispatch:
		inputs:
			force_notes:
				description: 'Regenerate ALL notes (overwrites Notes/)'
				type: boolean
				default: false

permissions:
	contents: write

concurrency:
	group: auto-update
	cancel-in-progress: false

jobs:
	update:
		runs-on: ubuntu-latest
		steps:
			- uses: actions/checkout@v4

			- uses: actions/setup-python@v5
				with:
					python-version: '3.12'

			- name: Generate notes and update README
				env:
					ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
					FORCE_NOTES: ${{ inputs.force_notes && '1' || '' }}
				run: python scripts/auto_update.py

			- name: Commit changes
				run: |
					git config user.name "github-actions[bot]"
					git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
					git add Notes README.md
					git diff --cached --quiet || (git commit -m "docs: auto notes + README update [skip ci]" && git pull --rebase && git push)
